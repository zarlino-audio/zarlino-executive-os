name = "zarlino-executive-os"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# ---------------------------------------------------------------------------
# The OS's real home: os.zarlinoaudio.com (also on the product domain, not a
# workers.dev subdomain). workers.dev stays enabled as a fallback but all
# first-party references use the custom domain.
# ---------------------------------------------------------------------------
workers_dev = true

[[routes]]
pattern = "os.zarlinoaudio.com"
custom_domain = true

# ---------------------------------------------------------------------------
# Workers AI: the executive tier (CEO agent cycles, summaries, light
# reasoning) runs here, consuming the account's daily neuron allowance.
# Budget + accounting live in code (default 10,000 neurons/day; env override
# AI_NEURON_DAILY_BUDGET). Heavy workers stay on DeepSeek.
# ---------------------------------------------------------------------------
[ai]
binding = "AI"

# ---------------------------------------------------------------------------
# Durable Object: the Executive's brain. SQLite-backed (use_sqlite = true) so
# the whole business store lives in the DO's embedded database and survives
# restarts. `migrations` block migrates the class on deploy.
# ---------------------------------------------------------------------------
[durable_objects]
bindings = [{ name = "EXECUTIVE_AGENT", class_name = "ExecutiveAgent" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ExecutiveAgent"]

# ---------------------------------------------------------------------------
# KV: shared page/license/revenue counters + affiliate program (same namespace
# the website worker uses, so the Executive can see live site counters).
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "ZARLINO_KV"
id = "66bc47e33fe145f697cf1f80912f269e"

# ---------------------------------------------------------------------------
# Artifact storage (R2, mandate §25): renders, build packages, reports —
# large outputs live OUTSIDE the DO's SQLite and are served through
# /api/artifacts. Created 2026-09-29 (bucket "zarlino-artifacts").
# ---------------------------------------------------------------------------
[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "zarlino-artifacts"

# ---------------------------------------------------------------------------
# Static assets: the Founder web console (React+Vite, built to web/dist).
# run_worker_first = true so /api/* reaches the Worker; the Worker then serves
# the console via env.ASSETS.fetch(request) for every non-API path.
# ---------------------------------------------------------------------------
[assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = true

# ---------------------------------------------------------------------------
# Static vars. Secrets (DEEPSEEK_API_KEY, FOUNDER_AUTH_TOKEN, PAYSTACK_SECRET_KEY,
# GITHUB_TOKEN, CF_API_TOKEN, ZARLINO_LICENSE_PRIVATE_KEY) are set via
# `wrangler secret put <NAME>` in production and live in .dev.vars locally.
# NOTE: FOUNDER_AUTH_TOKEN must NOT also appear here as a var — Cloudflare
# rejects a binding that is both a secret and a var (error 10053), and an
# empty var would shadow the real secret at runtime (auth would always 401).
# ---------------------------------------------------------------------------
[vars]
WEBSITE_URL = "https://zarlinoaudio.com"
# Second alert channel (Phase 0, 2026-10-02): ntfy.sh topic that receives
# external uptime alerts (website / OS API / downloads / WhatsApp bridge).
# Treat the topic like a shared secret — anyone who knows it can read or post.
# Swap for a private ntfy server (or an email provider) in a later phase.
ALERT_NTFY_URL = "https://ntfy.sh/zarlino-alerts-h7k2mq4x"
# USD line under which the OS alerts (both channels, 24h throttle) to top up:
# DeepSeek has no auto-recharge API, so the sentinel + saved card is the
# closest thing to "the OS manages its own top-ups".
AI_BALANCE_WARN_USD = "10"
# Outreach (Phase 1 growth): outbound email for the affiliate pipeline.
# EMAIL_API_KEY is a SECRET (`wrangler secret put EMAIL_API_KEY`); the rest are
# plain vars. Sends are hard-capped per day across manual + automatic paths.
OUTREACH_DAILY_CAP = "20"
# Growth agent (autonomous nurturing): separate small cap for LLM-drafted
# replies, and how many days a silent contacted prospect waits for ONE nudge.
GROWTH_REPLY_DAILY_CAP = "10"
FOLLOWUP_AFTER_DAYS = "5"
# Cloudflare Email Sending is the primary provider (binding below - no API key);
# brevo/mailjet stay available as fallbacks (set EMAIL_PROVIDER + EMAIL_API_KEY).
EMAIL_PROVIDER = "cloudflare"
EMAIL_FROM = "support@zarlinoaudio.com"
EMAIL_FROM_NAME = "Zarlino Audio"
EMAIL_REPLY_TO = "support@zarlinoaudio.com"
# Executive tier (Workers AI): the HIGH tier model every executive agent uses
# (CEO cycles, founder digests/replies) inside the 10k neurons/day budget.
# Heavy workers stay on DeepSeek.
EXEC_AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
# Daily allowance for the executive layer, and the slice of it that ONLY the
# founder channel may spend. The 15-minute CEO cron used to drain the whole
# 10k before the founder ever asked anything, which left his WhatsApp agent
# answering from a canned line - so background work now stops 2,500 neurons
# short and the founder's channel always has room to think.
AI_NEURON_DAILY_BUDGET = "10000"
AI_NEURON_CAO_RESERVE = "2500"
# CAO tier: the agent that runs the task board and answers the founder on
# WhatsApp. DeepSeek V4 Pro is the strongest model in the Workers AI catalog
# (1M context, reasoning none/low/high/max); measured reachable on this account
# via /api/ai/cao-probe (~1.2-1.9s). Because it reasons by default, a small
# token budget returns empty content - voice.ts calls it with reasoning_effort
# "none" and a 400-token floor. If the plan ever refuses it, voice.ts records
# the refusal and falls back to EXEC_AI_MODEL instead of failing.
CAO_AI_MODEL = "@cf/deepseek-ai/deepseek-v4-pro-0813"
AI_DAILY_BUDGET = "5"
AI_MONTHLY_BUDGET = "80"
AI_PER_TASK_BUDGET = "2"
AI_PER_RUN_BUDGET = "8"
# The founder's WhatsApp identity. His real number (+233546778438) is the
# default in code; this LID is how HIS account actually addresses the business
# line (WhatsApp linked-ID privacy mode hides the phone number entirely), so
# messages must be recognized as founder, not stranger.
WHATSAPP_FOUNDER_LIDS = "23790595616867"

# ---------------------------------------------------------------------------
# Email sending (growth outreach): Cloudflare Email Service binding.
# The zone (zarlinoaudio.com) already carries the Email Service MX/DKIM/SPF
# records; outreach sends as EMAIL_FROM through this binding on the account.
# ---------------------------------------------------------------------------
[[send_email]]
name = "SEND_EMAIL"

# ---------------------------------------------------------------------------
# Constant maintenance: the System Doctor auto-runs on this schedule (and on
# every DO wake/alarm). It reaps stale agent runs, re-queues expired local-task
# leases, clears expired sessions, verifies migrations, and logs every run.
# ---------------------------------------------------------------------------
[triggers]
# 0 */6 = OS maintenance sweep; */15 = external uptime monitor (worker-side);
# 15 3    = daily OS-database backup to R2 (kept 30 deep).
crons = ["0 */6 * * *", "*/15 * * * *", "15 3 * * *"]

[observability]
enabled = true
